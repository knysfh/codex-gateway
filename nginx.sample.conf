# Add these two server blocks to your existing nginx configuration.

server {
    listen 443 ssl http2;
    server_name codex.abc.com;

    ssl_certificate /etc/cert/abc.com/fullchain.cer;
    ssl_certificate_key /etc/cert/abc.com/private.key;

    client_max_body_size 20m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8317/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /v1/models {
        proxy_pass http://127.0.0.1:8317/v1/models;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /v0/management/ { return 403; }
    location = /management.html { return 403; }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    server_name cpam.abc.com;

    ssl_certificate /etc/cert/abc.com/fullchain.cer;
    ssl_certificate_key /etc/cert/abc.com/private.key;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
